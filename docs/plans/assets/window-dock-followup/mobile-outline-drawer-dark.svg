  <g font-size="11">
    <text x="530" y="70" font-weight="bold">行为（窗口 &lt;768px）</text>
    <text x="530" y="94">取代窗口内底部 Sheet</text>
    <text x="530" y="116">宽度 min(大纲宽度, 80%)</text>
    <text x="530" y="138">点击露出的编辑卡片关闭</text>
    <text x="530" y="160">Escape 关闭，焦点回大纲按钮</text>
    <text x="530" y="182">与侧栏抽屉互斥，同一时刻</text>
    <text x="530" y="198">只开一个</text>
    <text x="530" y="220">减少动效：无位移与缩放，</text>
