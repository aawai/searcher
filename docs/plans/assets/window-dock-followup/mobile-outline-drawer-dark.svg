  <text x="290" y="24" font-weight="bold">新增：大纲抽屉（从右向左滑出，镜像对称）</text>
  <rect x="290" y="36" width="200" height="400" rx="22" fill="none" stroke="#47474d" stroke-width="2"/>
  <rect x="302" y="48" width="176" height="316" rx="10" fill="#2a2a2e" stroke="#47474d"/>
  <text x="352" y="70" font-size="10" fill="#98989f">大纲</text>
