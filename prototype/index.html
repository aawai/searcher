<!doctype html>
<html lang="zh-CN" data-glass="regular">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
* { box-sizing: border-box; }
:root { --accent: #b03a5b; --serif: "Noto Serif CJK SC", "Source Han Serif SC", serif; }
html, body { margin: 0; font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 1920px; height: 945px; overflow: hidden; color: var(--foreground); background: #fcf8f5; }
.stage.m { width: 390px; height: 844px; }
.wall { position: absolute; inset: 0; background: #fcf8f5 url(wall.webp) center 18% / cover no-repeat; }
.stage[data-theme="dark"] .wall { filter: brightness(.34) saturate(1.15) hue-rotate(-8deg); }
.abs { position: absolute; }

/* chrome */
.wordmark { left: 44px; top: 18px; font-size: 14px; line-height: 22px; font-weight: 600; z-index: 5; }
.wordmark i { color: var(--accent); font-style: normal; }
.topctl { right: 36px; top: 12px; display: flex; gap: 10px; align-items: center; z-index: 5; }
.topctl .ico { width: 32px; height: 32px; display: grid; place-items: center; }
.topctl .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-control-thumb); box-shadow: 0 0 0 .5px rgb(0 0 0/.14), 0 1px 2px rgb(0 0 0/.12); display: grid; place-items: center; font-size: 12px; }
.dock { right: 12px; top: 178px; width: 52px; padding: 8px 6px; border-radius: 16px; display: flex; flex-direction: column; gap: 12px; align-items: center;
  background: var(--glass-sheen), var(--material-thick); backdrop-filter: var(--material-filter); box-shadow: var(--shadow-elevation-floating); }
.dock b { width: 26px; height: 26px; border-radius: 7px; background: rgb(128 128 128/.16); display: block; }
.dock b.on { background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.dock b.k { background: #16161a; } .dock b.o { background: #e8542f; } .dock b.v { background: linear-gradient(135deg,#7aa7ff,#b48cff); } .dock b.bl { background: #3d7be0; }
.dock hr { width: 24px; border: 0; border-top: 1px solid var(--border); margin: 0; }
.search { display: flex; align-items: center; gap: 10px; padding: 0 22px; height: 56px; font-size: 17px; color: var(--muted); border-radius: 999px;
  background: var(--glass-sheen), var(--material-regular); backdrop-filter: var(--material-filter); box-shadow: var(--shadow-elevation-material); }
.search .g { font-weight: 700; font-size: 16px; background: conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0); -webkit-background-clip: text; color: transparent; }
.search .sp { flex: 1; }

/* progressive frosted column: blur fades out instead of a white wash */
.veil { top: 0; bottom: 0; width: 820px;
  backdrop-filter: blur(28px) saturate(1.35); -webkit-backdrop-filter: blur(28px) saturate(1.35);
  background: color-mix(in srgb, var(--background) 46%, transparent);
  -webkit-mask-image: linear-gradient(90deg, #000 0 52%, transparent 100%); mask-image: linear-gradient(90deg, #000 0 52%, transparent 100%); }
.veil.right { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 0 52%, transparent 100%); mask-image: linear-gradient(270deg, #000 0 52%, transparent 100%); }
.stage[data-theme="dark"] .veil { background: color-mix(in srgb, #0e0d12 50%, transparent); }

/* masthead */
.col { width: 372px; }
.mast { display: grid; grid-template-columns: auto 1fr; column-gap: 18px; align-items: end; }
.day { font-family: var(--serif); font-weight: 700; font-size: 128px; line-height: 104px; letter-spacing: -.04em; }
.mast .side { padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; }
.mast .mon { font-family: var(--serif); font-size: 20px; line-height: 26px; font-weight: 600; }
.mast .wk { font-size: 13px; line-height: 18px; color: var(--muted); letter-spacing: .12em; }
.mast .time { font-size: 13px; line-height: 18px; font-variant-numeric: tabular-nums; color: var(--muted); }
.mast .time b { color: var(--foreground); font-weight: 600; }
.dek { margin-top: 18px; padding-top: 12px; border-top: 2px solid var(--foreground); display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; letter-spacing: .14em; }
.dek span:last-child { color: var(--muted); letter-spacing: .04em; }
.sec { margin-top: 28px; display: flex; align-items: baseline; gap: 10px; font-size: 12px; line-height: 16px; letter-spacing: .16em; font-weight: 600; color: var(--accent); }
.sec::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--foreground) 16%, transparent); transform: translateY(-4px); }
.sec .n { letter-spacing: 0; color: var(--muted); font-weight: 500; }
.tasks { margin-top: 8px; }
.task { position: relative; display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 30px; }
.task .box { width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1.5px solid color-mix(in srgb, var(--foreground) 55%, transparent); transform: translateY(2px); display: grid; place-items: center; }
.task.done .box { background: var(--accent); border-color: var(--accent); }
.task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--foreground) 35%, transparent); }
.task .src { margin-left: auto; font-size: 12px; color: var(--muted); }
.task.just .box { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.entries { margin-top: 6px; }
.entry { position: relative; display: grid; grid-template-columns: 30px 1fr; padding: 12px 0; }
.entry + .entry { border-top: 1px solid color-mix(in srgb, var(--foreground) 10%, transparent); }
.entry .no { font-family: var(--serif); font-size: 13px; line-height: 30px; color: var(--accent); font-variant-numeric: tabular-nums; }
.entry h4 { margin: 0; font-family: var(--serif); font-size: 21px; line-height: 30px; font-weight: 600; transition: transform .2s; }
.entry p { margin: 2px 0 0; font-size: 13px; line-height: 20px; color: color-mix(in srgb, var(--foreground) 76%, transparent); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry code { font-family: var(--font-mono); font-size: 12px; color: var(--foreground); }
.entry .m { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--muted); display: flex; gap: 12px; }
.entry.hover::before { content: ""; position: absolute; left: -16px; top: 16px; bottom: 16px; width: 2px; border-radius: 2px; background: var(--accent); }
.entry.hover h4 { transform: translateX(4px); }
.entry.hover h4::after { content: " ↗"; font-family: var(--font-sans); font-size: 14px; color: var(--accent); }
.copy { display: inline-flex; gap: 4px; align-items: center; color: var(--accent); font-weight: 600; }
.foot { margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; }
.foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
.foot span { color: var(--muted); }

/* annotations */
.anno { position: absolute; z-index: 90; font: 600 12px/16px var(--font-sans); color: #fff; background: #d6336c; padding: 5px 9px; border-radius: 7px; box-shadow: 0 2px 8px rgb(0 0 0/.18); max-width: 320px; }
.anno small { display: block; font-weight: 400; opacity: .94; margin-top: 2px; }
.caption { position: absolute; right: 90px; bottom: 28px; z-index: 90; background: rgb(255 255 255/.92); border-radius: 10px; padding: 10px 14px; box-shadow: 0 2px 10px rgb(0 0 0/.08); }
.caption b { display: block; font: 700 20px/28px var(--font-sans); color: #d6336c; }
.caption span { font: 400 13px/18px var(--font-sans); color: #333; }

/* mobile */
.m .wordmark { left: 20px; top: 14px; }
.m .topctl { right: 12px; top: 8px; }
.m .veil { width: auto; left: 0; right: 0; height: 800px; bottom: auto; -webkit-mask-image: linear-gradient(180deg, #000 0 86%, transparent 100%); mask-image: linear-gradient(180deg, #000 0 86%, transparent 100%); }
.m .day { font-size: 88px; line-height: 72px; }
.m .mon { font-size: 17px; line-height: 22px; }
.m .entry h4 { font-size: 18px; line-height: 26px; }
.tabbar { left: 12px; right: 12px; bottom: 12px; height: 56px; border-radius: 18px; display: flex; justify-content: space-around; align-items: center;
  background: var(--glass-sheen), var(--material-thick); backdrop-filter: var(--material-filter); box-shadow: var(--shadow-elevation-floating); }
.tabbar b { width: 24px; height: 24px; border-radius: 7px; background: rgb(128 128 128/.18); }
.tabbar b.on { background: color-mix(in srgb, var(--accent) 18%, transparent); box-shadow: inset 0 0 0 1.5px var(--accent); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
const CHECK = '<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg>';
const COPY = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

const anno = (x, y, t, s) => `<div class="anno" style="left:${x}px;top:${y}px">${t}${s ? `<small>${s}</small>` : ""}</div>`;
const caption = (t, s) => `<div class="caption"><b>${t}</b><span>${s}</span></div>`;
const task = (d, t, src, cls = "") => `<div class="task ${d ? "done" : ""} ${cls}"><span class="box">${d ? CHECK : ""}</span><span class="t">${t}</span><span class="src">${src}</span></div>`;
const searchBox = (x, y, w) => `<div class="abs search" style="left:${x}px;top:${y}px;width:${w}px"><span class="g">G</span><span style="font-size:11px">⌄</span><span class="sp">搜索或输入网址</span>${SEARCH}</div>`;

function column({ hover = 1, compact = false } = {}) {
  return `
  <div class="mast"><div class="day">3</div><div class="side"><div class="wk">星期二</div><div class="mon">十一月</div><div class="time"><b>09:41</b> · 晴 14°</div></div></div>
  <div class="dek"><span>静 · 今日</span><span>3 项待办 · 6 篇置顶</span></div>
  <div class="sec">待办 <span class="n">2 / 5</span></div>
  <div class="tasks">
    ${task(1, "笔记底栏对齐", "本周")}
    ${task(0, "首页笔记效果图", "本周", "just")}
    ${task(0, "玻璃档位实页", "本周")}
    ${compact ? "" : task(0, "清理截图", "本周")}
  </div>
  <div class="sec">置顶 <span class="n">6</span></div>
  <div class="entries">
    <div class="entry ${hover === 0 ? "hover" : ""}"><span class="no">01</span><div><h4>UI Rafctor</h4><p>是否引入 HeroUI v3 、Motion Primitives 、React Bits，结合项目现状给出取舍与迁移风险</p><div class="m">2 小时前</div></div></div>
    <div class="entry ${hover === 1 ? "hover" : ""}"><span class="no">02</span><div><h4>omp auth</h4><p><code>ssh -L 51121:127.0.0.1:51121 aawei@192.168.31.5</code></p><div class="m">昨天${hover === 1 ? '<span class="copy">' + COPY + ' 复制命令</span>' : ""}</div></div></div>
    ${compact ? "" : `<div class="entry"><span class="no">03</span><div><h4>部署</h4><p><code>deno task build</code> 后以 production 启动</p><div class="m">10月30日</div></div></div>`}
  </div>
  <div class="foot"><a>全部笔记 →</a><span>⌘N 新建</span></div>`;
}
function chrome(dark) {
  return `<div class="abs wordmark">s<i>.</i></div>
  <div class="abs topctl"><span class="ico">${dark ? MOON : SUN}</span><span class="avatar">y</span></div>`;
}
const dockHtml = `<div class="abs dock"><b class="on"></b><b></b><b></b><b></b><hr><b class="k"></b><b class="k"></b><b></b><b class="k"></b><b class="o"></b><b class="v"></b><b class="bl"></b><hr><span style="color:var(--muted)">···</span></div>`;

const scenes = {
  f1: () => `<div class="stage"><div class="wall"></div><div class="abs veil" style="left:0"></div>${chrome()}${dockHtml}
    ${searchBox(576, 331, 768)}
    <div class="abs col" style="left:104px;top:92px">${column()}</div>
    ${anno(500, 104, "刊头：日 / 月 / 星期 / 时间 / 天气", "衬线只用于数字与标题；与“静”合并，首页不再有第二个时间")}
    ${anno(500, 236, "粗线 + 导语栏", "一句话说明今天的状态")}
    ${anno(500, 400, "待办直接勾选", "刚勾选的一项出现强调色光晕 120ms")}
    ${anno(500, 520, "悬停：强调色竖线 + 标题右移 4px + ↗", "不出现卡片；代码条目给出“复制命令”")}
    ${anno(500, 720, "渐进磨砂替代白色遮罩", "blur 28px 向右渐隐；壁纸颜色保留，不发灰")}
    ${caption("刊头排版 · 优化版", "1920×945 · 浅色")}</div>`,

  f2: () => `<div class="stage" data-theme="dark"><div class="wall"></div><div class="abs veil" style="left:0"></div>${chrome(true)}${dockHtml}
    ${searchBox(576, 331, 768)}
    <div class="abs col" style="left:104px;top:92px">${column({ hover: 0 })}</div>
    ${caption("刊头排版 · 深色", "同一张壁纸压暗模拟深色壁纸；磨砂改为深色底")}</div>`,

  f3: () => `<div class="stage"><div class="wall" style="background-size:auto 112%;background-position:-160px 12%"></div><div class="abs veil right"></div>${chrome()}${dockHtml}
    ${searchBox(576, 331, 768)}
    <div class="abs col" style="left:1400px;top:92px">${column({ hover: -1 })}</div>
    ${anno(1010, 104, "主体偏左 → 刊头自动换到右侧", "按壁纸焦点 focalX 选边；“调整构图”里即时预览")}
    ${caption("刊头排版 · 按焦点选边", "主体在左时")}</div>`,

  f4: () => `<div class="stage m"><div class="wall" style="background-position:42% 0;background-size:auto 100%"></div><div class="abs veil"></div>${chrome()}
    <div class="abs col" style="left:20px;top:64px;width:350px">${column({ hover: -1, compact: true })}</div>
    ${searchBox(16, 708, 358)}
    <div class="abs tabbar"><b class="on"></b><b></b><b></b><b></b><b></b></div></div>`,
};
const key = location.hash.slice(1) || "f1";
document.getElementById("root").innerHTML = scenes[key]();
</script>
</body>
</html>
