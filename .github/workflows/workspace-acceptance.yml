name: Workspace acceptance (format and E2E)

on:
    pull_request:
        branches: [main]
        paths:
            - "deno.jsonc"
            - "deno.lock"
            - "scripts/e2e/**"
            - "web/**"
            - "src/**"
            - ".github/workflows/workspace-acceptance.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    workspace-format:
        name: Workspace touched-source Deno format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Verify modified UI and E2E source formatting
              run: >-
                  deno fmt --check
                  web/src/features/app-library/
                  web/src/components/searcher/launcher.css
                  web/e2e/apps-density.test.ts
                  web/e2e/home-launcher-density.test.ts
                  web/e2e/workspace-matrix.test.ts

    workspace-e2e:
        name: Full production Workspace E2E
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Verify E2E runner option contracts
              run: deno test -A scripts/e2e/
            - name: Install Chromium
              run: npx --yes playwright@1.56.1 install chromium
            - name: Run full Workspace production E2E
              env:
                  E2E_REPORT_DIR: artifacts/e2e/workspace
                  DENO_JOBS: "2"
              run: |
                  mkdir -p "$E2E_REPORT_DIR"
                  set -o pipefail
                  { deno --version; uname -a; lscpu; free -m; } \
                    | tee "$E2E_REPORT_DIR/environment.txt"
                  /usr/bin/time -v -o "$E2E_REPORT_DIR/resources.txt" \
                    deno task test:workspace 2>&1 | tee "$E2E_REPORT_DIR/stdout.log"
            - name: Upload Workspace E2E reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: workspace-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/e2e/workspace/
                  retention-days: 14
                  if-no-files-found: warn
