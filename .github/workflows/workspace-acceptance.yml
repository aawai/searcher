name: Workspace acceptance (format and E2E)

on:
    pull_request:
        branches: [main]
        paths:
            - "deno.jsonc"
            - "web/**"
            - "src/**"
            - ".github/workflows/workspace-acceptance.yml"
    push:
        branches:
            - "fix/zen-mobile-pinned-grid-68-4"

permissions:
    contents: read

jobs:
    workspace-format:
        name: Workspace touched-source Deno format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Verify modified UI and E2E source formatting
              run: >-
                  deno fmt --check
                  web/src/components/searcher/WebAppLauncher.tsx
                  web/src/components/searcher/launcher.css
                  web/e2e/apps-density.test.ts
                  web/e2e/home-launcher-density.test.ts

    workspace-e2e:
        name: Full production Workspace E2E
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Install Chromium
              run: npx --yes playwright@1.56.1 install --with-deps chromium
            - name: Run full Workspace production E2E
              run: deno task test:workspace
