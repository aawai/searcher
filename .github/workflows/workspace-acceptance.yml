name: Workspace acceptance (format and affected E2E)

on:
    pull_request:
        branches: [main]
        paths:
            - "deno.jsonc"
            - "deno.lock"
            - "scripts/e2e/**"
            - "web/**"
            - "src/**"
            - ".github/workflows/workspace-acceptance.yml"
            - ".github/actions/install-chromium/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    workspace-format:
        name: Workspace touched-source Deno format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Verify modified UI and E2E source formatting
              run: >-
                  deno fmt --check
                  web/src/features/app-library/
                  web/src/components/searcher/launcher.css

    plan-affected-e2e:
        name: Plan affected production E2E shards
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            run_e2e: ${{ steps.affected.outputs.run_e2e }}
            suites: ${{ steps.affected.outputs.suites }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Verify E2E runner option contracts
              run: deno test -A scripts/e2e/
            - name: Determine affected E2E shards
              id: affected
              run: |
                  set -o pipefail
                  LIST_OUTPUT=$(deno run -A scripts/e2e/run.ts affected --base "origin/${{ github.base_ref }}" --list)
                  echo "$LIST_OUTPUT"
                  SHARDS_JSON=$(echo "$LIST_OUTPUT" | sed -n 's/^Affected shards: //p' | tail -n 1)
                  if [ -z "$SHARDS_JSON" ] || [ "$SHARDS_JSON" = "[]" ]; then
                    echo "run_e2e=false" >> "$GITHUB_OUTPUT"
                    echo "suites=[\"none\"]" >> "$GITHUB_OUTPUT"
                  else
                    echo "run_e2e=true" >> "$GITHUB_OUTPUT"
                    echo "suites=$SHARDS_JSON" >> "$GITHUB_OUTPUT"
                  fi

    affected-e2e:
        name: Affected production ${{ matrix.suite }} E2E
        needs: plan-affected-e2e
        if: needs.plan-affected-e2e.outputs.run_e2e == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                suite: ${{ fromJson(needs.plan-affected-e2e.outputs.suites) }}
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Install Chromium
              timeout-minutes: 12
              uses: ./.github/actions/install-chromium
            - name: Run affected ${{ matrix.suite }} production E2E
              env:
                  E2E_REPORT_DIR: artifacts/e2e/${{ matrix.suite }}
                  E2E_SCHEDULE: --parallel
                  DENO_JOBS: "2"
              run: |
                  mkdir -p "$E2E_REPORT_DIR"
                  set -o pipefail
                  { deno --version; uname -a; lscpu; free -m; } \
                    | tee "$E2E_REPORT_DIR/environment.txt"
                  /usr/bin/time -v -o "$E2E_REPORT_DIR/resources.txt" \
                    deno run -A scripts/e2e/run.ts ${{ matrix.suite }} "$E2E_SCHEDULE" \
                    2>&1 | tee "$E2E_REPORT_DIR/stdout.log"
            - name: Upload ${{ matrix.suite }} E2E reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: affected-${{ matrix.suite }}-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/e2e/${{ matrix.suite }}/
                  retention-days: 14
                  if-no-files-found: warn
