name: Workspace acceptance (format and affected E2E)

on:
    pull_request:
        branches: [main]
        paths:
            - "deno.jsonc"
            - "deno.lock"
            - "scripts/e2e/**"
            - "web/**"
            - "src/**"
            - ".github/workflows/workspace-acceptance.yml"
            - ".github/actions/install-chromium/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    workspace-format:
        name: Workspace touched-source Deno format check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Verify modified UI and E2E source formatting
              run: >-
                  deno fmt --check
                  web/src/features/app-library/
                  web/src/components/searcher/launcher.css

    affected-e2e:
        name: Affected production E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Verify E2E runner option contracts
              run: deno test -A scripts/e2e/
            - name: Determine affected E2E suites
              id: affected
              run: |
                  set -o pipefail
                  LIST_OUTPUT=$(deno run -A scripts/e2e/run.ts affected --base "origin/${{ github.base_ref }}" --list)
                  echo "$LIST_OUTPUT"
                  if echo "$LIST_OUTPUT" | grep -q "^Affected suites: none$"; then
                    echo "run_e2e=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "run_e2e=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Install Chromium
              if: steps.affected.outputs.run_e2e == 'true'
              timeout-minutes: 12
              uses: ./.github/actions/install-chromium
            - name: Run affected production E2E
              if: steps.affected.outputs.run_e2e == 'true'
              env:
                  E2E_REPORT_DIR: artifacts/e2e/affected
                  DENO_JOBS: "2"
              run: |
                  mkdir -p "$E2E_REPORT_DIR"
                  set -o pipefail
                  { deno --version; uname -a; lscpu; free -m; } \
                    | tee "$E2E_REPORT_DIR/environment.txt"
                  /usr/bin/time -v -o "$E2E_REPORT_DIR/resources.txt" \
                    deno run -A scripts/e2e/run.ts affected --base "origin/${{ github.base_ref }}" --parallel --no-fail-fast \
                    2>&1 | tee "$E2E_REPORT_DIR/stdout.log"
            - name: Upload affected E2E reports
              if: always() && steps.affected.outputs.run_e2e == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: affected-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/e2e/affected/
                  retention-days: 14
                  if-no-files-found: warn
