name: Notes contracts and regression

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ format('run-{0}', github.run_id) }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    notes-regression:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Install Chromium
              timeout-minutes: 12
              uses: ./.github/actions/install-chromium
            - name: Home masthead tasks, order and document regression
              run: deno task test:home-masthead
