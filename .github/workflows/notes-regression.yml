name: Notes contracts and regression

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    notes-regression:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Install Chromium
              run: npx --yes playwright@1.56.1 install --with-deps chromium
            - name: Home notes persistence and order regression
              run: deno task test:home-notes
