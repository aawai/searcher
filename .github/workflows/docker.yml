name: Docker Image

on:
    pull_request:
        branches:
            - main
        paths:
            - Dockerfile
            - .dockerignore
            - deno.jsonc
            - deno.runtime.jsonc
            - deno.lock
            - "src/**"
            - "web/**"
            - "drizzle/**"
            - scripts/runtime-lock.ts
            - ".github/workflows/docker.yml"
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: docker-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    SMOKE_IMAGE: searcher-smoke:ci

jobs:
    build:
        name: Build container image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,prefix=sha-
                      type=ref,event=tag

            - name: Build runtime image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: false
                  load: true
                  tags: |
                      ${{ env.SMOKE_IMAGE }}
                      ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test runtime image
              shell: bash
              run: |
                  set -euo pipefail

                  docker run --rm --entrypoint sh "$SMOKE_IMAGE" -c 'test "$(id -u)" != 0 && test ! -e /app/node_modules && test ! -d /deno-dir/npm/registry.npmjs.org/shadcn'

                  cleanup() {
                      docker logs searcher-smoke || true
                      docker rm -fv searcher-smoke >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  docker run -d \
                      --name searcher-smoke \
                      --network none \
                      -e APP_ORIGIN=http://localhost:34567 \
                      -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
                      "$SMOKE_IMAGE"

                  ready=false
                  for _ in $(seq 1 30); do
                      if docker exec searcher-smoke deno eval 'const response = await fetch("http://localhost:34567/"); if (!response.ok) Deno.exit(1);'; then
                          ready=true
                          break
                      fi
                      sleep 1
                  done

                  if [ "$ready" != "true" ]; then
                      echo "Searcher did not become ready within 30 seconds" >&2
                      exit 1
                  fi

                  printf 'SmokeAdminPassword123!\nSmokeAdminPassword123!\n' | \
                      docker exec -i searcher-smoke \
                          deno run -A --cached-only --node-modules-dir=none \
                          src/commands/admin.ts create smoke_admin

                  printf 'SmokeResetPassword456!\nSmokeResetPassword456!\n' | \
                      docker exec -i searcher-smoke \
                          deno run -A --cached-only src/commands/admin.ts reset smoke_admin

                  docker exec searcher-smoke sh -c 'test ! -e /app/node_modules'
                  docker image inspect "$SMOKE_IMAGE" --format 'Runtime image size: {{.Size}} bytes'

            - name: Publish tested image
              if: github.event_name != 'pull_request'
              env:
                  IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
              shell: bash
              run: |
                  set -euo pipefail
                  while IFS= read -r tag; do
                      docker push "$tag"
                  done <<< "$IMAGE_TAGS"
