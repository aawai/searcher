name: AGENTS.md Reference Guard

on:
    push:
        branches:
            - main
            - "refactor/**"
            - "feature/**"
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check-agents:
        name: AGENTS.md paths, tasks, env, Deno version and anchors
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7

            - name: Verify AGENTS.md references (deno task check:agents)
              run: deno task check:agents

            - name: Run AGENTS guard test suite
              run: deno test -A scripts/agents-guard/
