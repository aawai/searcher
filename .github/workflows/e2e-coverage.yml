name: Complete Documents, Workspace, Routing and Supplemental E2E

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ format('run-{0}', github.run_id) }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    complete-e2e:
        name: Full production ${{ matrix.suite }} E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                suite:
                    - workspace-a
                    - workspace-b
                    - documents-core
                    - pagination-mixed
                    - routing
                    - supplemental
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Install Chromium
              timeout-minutes: 12
              uses: ./.github/actions/install-chromium
            - name: Run complete ${{ matrix.suite }} production E2E
              env:
                  E2E_REPORT_DIR: artifacts/e2e/${{ matrix.suite }}
                  # Multi-file shards run in parallel; single-file pagination shards and short suites run serially.
                  E2E_SCHEDULE: ${{ (matrix.suite == 'documents-core' || matrix.suite == 'workspace-a' || matrix.suite == 'workspace-b') && '--parallel' || '--serial' }}
                  DENO_JOBS: "2"
              run: |
                  mkdir -p "$E2E_REPORT_DIR"
                  set -o pipefail
                  { deno --version; uname -a; lscpu; free -m; } \
                    | tee "$E2E_REPORT_DIR/environment.txt"
                  /usr/bin/time -v -o "$E2E_REPORT_DIR/resources.txt" \
                    deno run -A scripts/e2e/run.ts ${{ matrix.suite }} "$E2E_SCHEDULE" \
                    2>&1 | tee "$E2E_REPORT_DIR/stdout.log"
            - name: Upload ${{ matrix.suite }} E2E reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.suite }}-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
                  path: artifacts/e2e/${{ matrix.suite }}/
                  retention-days: 14
                  if-no-files-found: warn
