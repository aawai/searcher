name: Wallpaper contracts

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    wallpaper:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Unit and API contracts
              run: deno task test
            - name: Install Chromium
              run: npx --yes playwright@1.56.1 install chromium
            - name: Production wallpaper user journeys
              env:
                  WALLPAPER_READABILITY_MATRIX: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
              run: deno task test:wallpaper
