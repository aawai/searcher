name: Wallpaper contracts

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    wallpaper:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.9.7
            - name: Install dependencies
              run: deno install
            - name: Unit and API contracts
              run: deno task test
            - name: UI guard
              run: deno task check:ui
            - name: Install Chromium
              run: npx --yes playwright@1.56.1 install --with-deps chromium
            - name: Production wallpaper user journeys
              run: deno task test:wallpaper
            - name: Upload wallpaper motion evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: wallpaper-motion-evidence-${{ github.run_id }}
                  path: artifacts/wallpaper-motion/
                  retention-days: 14
